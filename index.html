<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mara Medina · Edición de video</title>
<meta name="description" content="Mara Medina, editora de video: short-form, comerciales y motion graphics para marcas y creadores.">
<meta property="og:title" content="Mara Medina · Edición de video">
<meta property="og:description" content="Short-form, comerciales y motion graphics.">
<meta property="og:image" content="media/demo-reel.jpg">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="icono/icono-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icono/icono-192.png">
<link rel="apple-touch-icon" href="icono/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11.1.14/swiper-bundle.min.css">
<link rel="stylesheet" href="estilos.css?v=20261028m">
</head>
<body>
  <nav class="nav" aria-label="Principal">
    <span>Edición de video</span>
    <ul><li><a href="#trabajo">Trabajo</a></li><li><a href="#contacto">Contacto</a></li></ul>
  </nav>

  <header class="cabecera">
    <div class="presentacion">
      <h1 class="nombre">Mara<br>Medina</h1>
      <div class="bajada">
        <p>Editora de video. Short-form, comerciales y motion graphics para marcas y creadores.</p>
        <a href="mailto:maramedinamtz22@gmail.com">maramedinamtz22@gmail.com</a>
      </div>
    </div>
    <div class="reel" id="reel"></div>
  </header>

  <main>
    <section class="muro" id="trabajo" aria-labelledby="t-proyectos">
      <h2 class="muro__titulo" id="t-proyectos">Proyectos completos</h2>
      <div class="swiper carrusel">
        <div class="swiper-wrapper" id="proyectos"></div>
        <button type="button" class="carrusel__flecha carrusel__flecha--prev" aria-label="Proyecto anterior">←</button>
        <button type="button" class="carrusel__flecha carrusel__flecha--next" aria-label="Proyecto siguiente">→</button>
        <div class="carrusel__puntos"></div>
      </div>
    </section>

    <section class="youtube" aria-labelledby="t-youtube">
      <h2 class="muro__titulo" id="t-youtube">Publicado en YouTube</h2>
      <div class="youtube__videos">
        <figure class="youtube__video youtube__video--largo">
          <div class="youtube__marco">
            <iframe src="https://www.youtube-nocookie.com/embed/0PaxTfLC9-8" title="La matemática detrás de mi estrategia para pasar cuentas de fondeo" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
          </div>
          <figcaption>
            <span class="pieza__tema">Video largo · José Rivas | Total Trader</span>
            <span class="pieza__titulo">La matemática detrás de mi estrategia para pasar cuentas de fondeo</span>
            <a class="youtube__enlace" href="https://youtu.be/0PaxTfLC9-8" target="_blank" rel="noopener">Ver en YouTube ↗</a>
          </figcaption>
        </figure>
        <figure class="youtube__video youtube__video--short">
          <div class="youtube__marco">
            <iframe src="https://www.youtube-nocookie.com/embed/6-uEseZv1-c" title="¿Una moneda puede aprobar más cuentas de fondeo que tu estrategia?" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
          </div>
          <figcaption>
            <span class="pieza__tema">Short · José Rivas | Total Trader</span>
            <span class="pieza__titulo">¿Una moneda puede aprobar más cuentas de fondeo que tu estrategia?</span>
            <a class="youtube__enlace" href="https://www.youtube.com/shorts/6-uEseZv1-c" target="_blank" rel="noopener">Ver en YouTube ↗</a>
          </figcaption>
        </figure>
      </div>
    </section>

    <section class="cierre" id="contacto">
      <h2>Contáctame</h2>
      <div class="correo">
        <a href="mailto:maramedinamtz22@gmail.com">maramedinamtz22@gmail.com</a>
        <button type="button" class="copiar" data-copiar="maramedinamtz22@gmail.com" aria-label="Copiar correo" title="Copiar correo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>
        </button>
        <span class="copiar__aviso" role="status" aria-live="polite"></span>
      </div>
      <a href="https://wa.me/13613336608" target="_blank" rel="noopener">WhatsApp +1 (361) 333-6608</a>
      <p>© 2026 Mara Medina</p>
    </section>
  </main>

  <dialog class="visor" id="visor" aria-label="Video completo">
    <div class="visor__caja">
      <video controls playsinline></video>
      <div class="visor__pie">
        <div><p class="visor__tema"></p><p class="visor__titulo"></p></div>
        <button type="button" class="visor__cerrar">Cerrar</button>
      </div>
    </div>
  </dialog>

<script src="https://cdn.jsdelivr.net/npm/swiper@11.1.14/swiper-bundle.min.js"></script>
<script src="app.js?v=20261028m"></script>
</body>
</html>
